<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pessoas Participantes</title>

    <link rel="stylesheet" href="../../../CSS_Estilo/importar_estilo_aba.css">
    <!-- Font Awesome para renderizar os ícones dos botões -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <!-- PÁGINA PESSOAS PARTICIPANTES -->
    <div id="pessoasParticipantes">

        <!-- CABEÇALHO DA PÁGINA -->
        <h2 class="TituloPagina">Pessoas Participantes</h2>
        <p class="DescricaoPagina">A tabela vai mostrar todas as pessoas para cadastrarem no Planejamento Estratégico da
            Empresa.</p>

        <!-- CONTAINER DA TABELA + BOTÕES DE AÇÃO -->
        <div class="container-tabela-com-botoes">

            <!-- LADO ESQUERDO: TABELA -->
                <table class="tabela-padrao">
                    <thead class="tabela-cabecalho">
                        <tr class="tabela-linha">
                            <th class="tabela-coluna">Foto</th>
                            <th class="tabela-coluna">Nome da Pessoa</th>
                            <th class="tabela-coluna">Email</th>
                            <th class="tabela-coluna">Área da Empresa</th>
                        </tr>
                    </thead>
                    <tbody class="tabela-corpo" id="corpoTabelaPessoas">
                        <tr class="tabela-linha">
                            <td class="tabela-celula celula-foto">
                                <img src="../../../Imagem/Perfil_usuario/foto_usuario.png" alt="Foto de João Silva" class="foto-tabela">
                            </td>
                            <td class="tabela-celula">Gabriel Agapito</td>
                            <td class="tabela-celula">gabriel.agapito@empresa.com</td>
                            <td class="tabela-celula">CEO</td>
                        </tr>
                    </tbody>
                </table>

            <!-- LADO DIREITO: BOTÕES DE AÇÃO -->
            <div class="coluna-direita">
                <button class="botaoAtualizar" onclick="atualizar_PessoasParticipantes()" title="Atualizar Tabela">
                    <i class="fa-solid fa-arrows-rotate"></i>
                </button>

                <button class="botaoCadastro_formulario" onclick="openModal()" title="Abrir Formulário">
                    <i class="fa-solid fa-clipboard-list"></i>
                </button>
            </div>

        </div>

    </div>

</body>

</html>
