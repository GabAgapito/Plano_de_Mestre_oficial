<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="../../CSS_Estilo/Paginas/Abas.css">
    <link rel="stylesheet" href="../../CSS_Estilo/Paginas/Estrutura_Aba.css">
    <link rel="stylesheet" href="../../CSS_Estilo/Paginas/Estilo_Tabela.css">
    <link rel="stylesheet" href="../../CSS_Estilo/Paginas/Estilo_Formulario.css">
    
</head>
<body>

    <!-- PÁGINA Pessoas Participantes -->
    <div id="pessoasParticipantes">
    
        <div class="container-geral">
    
            <div class="coluna-esquerda">
                <h2 class="TituloPagina">Pessoas Participantes</h2>
                <p>A tabela vai mostrar todas as pessoas para cadastrarem no Planejamento Estratégico da Empresa</p>
                <br />
                <table>
                    <thead>
                        <tr>
                            <th>Nome da Pessoa</th>
                            <th>Email</th>
                            <th>Área da Empresa</th>
                        </tr>
                    </thead>
                    <tbody id="corpoTabela2">
                    </tbody>
                </table>
            </div>
    
            <div class="coluna-direita">
                <button class="botaoAtualizar" onclick="atualizar_PessoasParticipantes()" title="Atualizar Dados">
                    <i class="fa-solid fa-arrows-rotate"></i>
                </button>
                <button class="botaoCadastro_formulario">
                    <i class="fa-solid fa-clipboard-list"></i>
                </button>
            </div>
    
        </div>
    </div>





    
</body>
</html>
