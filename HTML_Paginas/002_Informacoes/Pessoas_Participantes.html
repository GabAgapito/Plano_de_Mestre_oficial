<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="../../CSS_Estilo/importar_estilo_aba.css">

</head>
<body>

    <!-- PÁGINA Pessoas Participantes -->
    <div id="pessoasParticipantes">

        <!-- CABEÇALHO DA PÁGINA (FORA DO FLEXBOX) -->
        <h2 class="TituloPagina">Pessoas Participantes</h2>
        <p>A tabela vai mostrar todas as pessoas para cadastrarem no Planejamento Estratégico da Empresa</p>
    
        <div class="container-geral">
            <div class="coluna-esquerda">
                <table class="tabela-padrao">
                    <thead class="tabela-cabecalho">
                        <tr class="tabela-linha">
                            <th class="tabela-coluna">Nome da Pessoa</th>
                            <th class="tabela-coluna">Email</th>
                            <th class="tabela-coluna">Área da Empresa</th>
                        </tr>
                    </thead>
                    <tbody class="tabela-corpo">
                        <tr class="tabela-linha">
                            <td class="tabela-celula">João Silva</td>
                            <td class="tabela-celula">joao.silva@empresa.com</td>
                            <td class="tabela-celula">Financeiro</td>
                        </tr>
                    </tbody>
                </table>
            </div>
    
            <div class="coluna-direita">
                <button class="botaoAtualizar" onclick="atualizar_PessoasParticipantes()" title="Atualizar Dados">
                    <i class="fa-solid fa-arrows-rotate"></i>
                </button>
                <button class="botaoCadastro_formulario">
                    <i class="fa-solid fa-clipboard-list"></i>
                </button>
            </div>
    
        </div>
    </div>





    
</body>
</html>
