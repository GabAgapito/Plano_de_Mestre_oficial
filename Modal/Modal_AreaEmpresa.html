           <!-- Modal Popup do Area da Empresa -->
<div id="modalAreaEmpresa" class="modal" style="display: none;">
    <div class="content">
        <h2 class="titulo_formulario">Cadastro das Áreas da Empresa</h2>
        <span class="close" onclick="closeModal()">X</span>
        <form id="fornecedorForm">
            <label class ="label_form" for="nome">Nome da Área</label>
            <input class ="input_form" type="text" id="nomeArea" name="nome" required>
            <br/>
            <br/>
            <button class="botaoCadastro_formulario" type="submit" onclick="cadastrarFormulario()">Cadastrar</button>
        </form>
    </div>
</div>
