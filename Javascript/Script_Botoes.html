<script>
    // 1. ATUALIZAR: Área da Empresa
    function atualizar_AreaEmpresa() {
        const icone = document.querySelector('#areaEmpresa .botaoAtualizar i');
        if (icone) {
            icone.classList.add('rodar');
        }

        google.script.run.withSuccessHandler(function(tabelaAreaEmpresa) {
            let tabelaAreaEmpresa2 = JSON.parse(tabelaAreaEmpresa);
            let corpoTabela = document.getElementById("corpoTabela");

            corpoTabela.innerHTML = "";
            
            for(let j = 0; j < tabelaAreaEmpresa2.length; j++) {
                var tr = document.createElement("tr");
                for(let i = 0; i < 1; i++) {
                    var td = document.createElement("td");
                    let valorCelula = Array.isArray(tabelaAreaEmpresa2[j]) ? tabelaAreaEmpresa2[j][i] : tabelaAreaEmpresa2[j];
                    td.innerHTML = valorCelula !== undefined ? valorCelula : ""; 
                    tr.appendChild(td);
                }
                corpoTabela.appendChild(tr);
            }

            if (icone) {
                icone.classList.remove('rodar');
            }
            console.log("Dados da Empresa atualizados!");
        }).areaEmpresa(); 
    }

    // 2. ATUALIZAR: Pessoas Participantes (Agora com o efeito visual corrigido)
    function atualizar_PessoasParticipantes(){
        const icone = document.querySelector('#pessoasParticipantes .botaoAtualizar i');
        if (icone) {
            icone.classList.add('rodar');
        }
        
        google.script.run.withSuccessHandler(function(tabelaPessoasParticipantes) {
            let tabela_PessoasParticipantes2 = JSON.parse(tabelaPessoasParticipantes);
            let corpoTabela2 = document.getElementById("corpoTabela2");

            corpoTabela2.innerHTML = "";
            
            for (let j = 0; j < tabela_PessoasParticipantes2.length; j++) {
                var tr = document.createElement("tr");

                for (let i = 0; i < 3; i++) {
                    var td = document.createElement("td");
                    td.innerHTML = tabela_PessoasParticipantes2[j][i] !== undefined ? tabela_PessoasParticipantes2[j][i] : ""; 
                    tr.appendChild(td);
                }
                corpoTabela2.appendChild(tr);
            }

            if (icone) {
                icone.classList.remove('rodar');
            }
            console.log("Dados de Pessoas atualizados!");
        }).pessoasParticipantes();
    }

    // 3. CONTROLE: Modais
    function openModal() {
        document.getElementById('modalAreaEmpresa').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modalAreaEmpresa').style.none = 'none'; // Corrigido erro de sintaxe .style.display
        document.getElementById('modalAreaEmpresa').style.display = 'none';
    }

    window.onclick = function(event) {
        if (event.target === document.getElementById('modalAreaEmpresa')) {
            closeModal();
        }
    }

    // 4. CADASTRO: Área da Empresa (Limpo e sem o bug da variável oculta)
    function cadastrar_AreaEmpresa() {
        google.script.run.withSuccessHandler(function(tabelaAreaEmpresa) {
            let tabelaAreaEmpresa2 = JSON.parse(tabelaAreaEmpresa);
            let corpoTabela = document.getElementById("corpoTabela");

            corpoTabela.innerHTML = "";
            
            for(let j = 0; j < tabelaAreaEmpresa2.length; j++) {
                var tr = document.createElement("tr");
                for(let i = 0; i < 1; i++) {
                    var td = document.createElement("td");
                    let valorCelula = Array.isArray(tabelaAreaEmpresa2[j]) ? tabelaAreaEmpresa2[j][i] : tabelaAreaEmpresa2[j];
                    td.innerHTML = valorCelula !== undefined ? valorCelula : ""; 
                    tr.appendChild(td);
                }
                corpoTabela.appendChild(tr);
            }
            console.log("Cadastro realizado com sucesso!");
        }).areaEmpresa(); 
    }
</script>
