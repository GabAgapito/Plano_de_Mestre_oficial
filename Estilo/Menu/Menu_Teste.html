<!DOCTYPE html>
<html>
  <style>
    
.menu-navegacao ul {
    list-style-type: none; 
    margin: 0;
    padding: 0;
    background-color: #333; /* Fundo escuro elegante para o menu */
    display: flex; 
    border-radius: 6px;
    overflow: hidden;
}

.menu-navegacao li a {
    display: block;
    color: white !important;
    text-align: center;
    padding: 14px 20px;
    text-decoration: none; 
    cursor: pointer;
    font-size: 16px;
    transition: background-color 0.2s ease;
}

/* Efeito Hover (passar o mouse) */
.menu-navegacao li a:hover {
    background-color: #111; 
}

/* Mantém o suporte para o seu botão roxo ativo */
.menu-navegacao li a.active {
    background-color: #4D3DFE !important; /* Seu roxo oficial */
    font-weight: bold;
}

  </style>
</html>
