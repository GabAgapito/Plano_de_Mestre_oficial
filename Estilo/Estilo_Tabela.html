<!DOCTYPE html>
<html>
  <style>

  /* CSS da Tabela */

  table {
    border-collapse: collapse;
    width: 100%;
  }

  th,
  td {
    border: 1px solid #ddd;
    padding: 8px;
  }

  th {
    background-color: #D9D2FE;
    color: black;
  }

  thead {
    font-size: 14px;
  }

  tbody {
    background-color: #FFFFFF;
    color: black;
  }

  </style>
</html>
